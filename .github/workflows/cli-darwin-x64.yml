name: CLI (Intel Mac)

# Upstream ships no macOS x64 CLI archive because Node's SEA docs list macOS as
# arm64 only. Building the executable natively on an Intel runner works, so this
# fork-only workflow produces `t3-<version>-darwin-x64.tar.gz`, laid out exactly
# like the other platforms' archives.
#
# Keep this separate from release.yml: its `release` job needs every desktop
# build, so dropping the other platforms there would break publishing. That
# workflow also skips itself in forks (resolve_commit gates on the upstream
# repository), so it cannot add cost here.
#
# `publish_release` distributes a T3-branded binary. TRADEMARK.md reserves that
# branding for official distributions; this fork's owner accepts the risk for a
# personal machine. The release is marked prerelease and unofficial so it does
# not present itself as official. Keep it that way.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Archive version. Defaults to apps/server/package.json.
        required: false
        type: string
      publish_release:
        description: Attach the archive to a release in this fork.
        required: false
        type: boolean
        default: true

concurrency:
  group: cli-darwin-x64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build darwin-x64 CLI archive
    # GitHub-hosted Intel. macos-15-intel is the older equivalent.
    runs-on: macos-26-intel
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Vendored references, not build inputs.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          # Same closure release.yml's build_bundle installs for t3#build and
          # the build scripts.
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$(node -p "require('./apps/server/package.json').version")}"
          # The server bundle reports APP_VERSION; keep it in step with the
          # archive name or the smoke test's --version check fails.
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build web client
        run: vp run --filter @t3tools/web build

      # Bundles the server and copies apps/web/dist to apps/server/dist/client,
      # which the archive ships.
      - name: Build server
        run: node apps/server/scripts/cli.ts build --verbose

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Build resource monitor
        run: >-
          cargo build --locked --release
          --manifest-path native/resource-monitor/Cargo.toml
          --target x86_64-apple-darwin

      - name: Stage resource monitor
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/darwin-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-apple-darwin/release/t3-resource-monitor \
            "$target_dir/t3-resource-monitor"

      # Signs ad hoc when no Developer ID is configured, which is enough for a
      # locally downloaded archive (no quarantine attribute via `gh run download`).
      - name: Build CLI archive
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts \
            --platform mac \
            --arch x64 \
            --version "${{ steps.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      # Extracts the archive, runs --version and the service launcher from it,
      # then serves it and waits for HTTP 200.
      - name: Smoke-test CLI archive
        run: >-
          node scripts/smoke-cli-archive.ts
          --archive release-cli/*
          --expect-version "${{ steps.version.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-darwin-x64
          path: release-cli/*
          if-no-files-found: error
          # Already gzip; deflating again saves under 2%.
          compression-level: 0

  release:
    name: Publish unofficial release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-darwin-x64
          path: release-cli

      # The tag is `v<version>` and the archive ships beside SHA256SUMS, matching
      # the layout t3 update expects, so a later build can point at this fork.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          cd release-cli
          sha256sum ./*.tar.gz > SHA256SUMS
          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes="Unofficial Intel Mac (x86_64) build from ${GH_REPO}@${SHA:0:7}. Not an official T3 Code distribution, and not affiliated with or endorsed by T3 Tools, Inc. T3 Code and its branding belong to T3 Tools, Inc. (see TRADEMARK.md in the repository). Download the tar.gz, extract it, and run ./t3."
            gh release create "$tag" \
              --prerelease \
              --target "$SHA" \
              --title "Unofficial Intel Mac CLI ${VERSION}" \
              --notes "$notes"
          fi
          gh release upload "$tag" ./*.tar.gz SHA256SUMS --clobber
